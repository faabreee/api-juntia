spring.application.name=joinify

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/juntia}
spring.datasource.username=${DB_USER:juntia}
spring.datasource.password=${DB_PASSWORD:juntia}

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Sesión en servidor (ADR 0005)
spring.session.jdbc.initialize-schema=never
spring.session.timeout=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Correo (Mailpit en local)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:no-reply@juntia.local}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
management.health.mail.enabled=false

# Archivos subidos (portadas). Local por ahora; la interfaz CoverStorage permite cambiar a S3 después.
app.storage.dir=${STORAGE_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Errores como application/problem+json con el motivo en "detail" (ResponseStatusException)
spring.mvc.problemdetails.enabled=true

# Órdenes: tiempo de reserva del cupo antes de expirar, y cada cuánto se barren las vencidas
app.orders.hold-minutes=${ORDER_HOLD_MINUTES:15}
app.orders.expiry-interval-ms=${ORDER_EXPIRY_INTERVAL_MS:15000}
