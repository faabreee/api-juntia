spring.application.name=joinify

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/juntia}
spring.datasource.username=${DB_USER:juntia}
spring.datasource.password=${DB_PASSWORD:juntia}

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Sesión en servidor (ADR 0005)
spring.session.jdbc.initialize-schema=never
spring.session.timeout=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Correo (Mailpit en local)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:no-reply@juntia.local}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
management.health.mail.enabled=false

# Archivos subidos (portadas). Local por ahora; la interfaz CoverStorage permite cambiar a S3 después.
app.storage.dir=${STORAGE_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Errores como application/problem+json con el motivo en "detail" (ResponseStatusException)
spring.mvc.problemdetails.enabled=true

# Órdenes: tiempo de reserva del cupo antes de expirar, y cada cuánto se barren las vencidas
app.orders.hold-minutes=${ORDER_HOLD_MINUTES:15}
app.orders.expiry-interval-ms=${ORDER_EXPIRY_INTERVAL_MS:15000}

# Comisión de la plataforma por defecto (cada organización puede tener la suya). 500 pb = 5 %.
app.fees.mode=${FEE_MODE:PASSED_TO_BUYER}
app.fees.bps=${FEE_BPS:500}
app.fees.fixed-minor=${FEE_FIXED_MINOR:0}

# Pasarela de pago: simulated (desarrollo y pruebas) | culqi
app.payments.provider=${PAYMENT_PROVIDER:simulated}
app.payments.reconcile-interval-ms=${PAYMENT_RECONCILE_INTERVAL_MS:60000}
app.payments.simulated.webhook-secret=${SIMULATED_WEBHOOK_SECRET:dev-only-simulated-secret}
app.payments.culqi.base-url=${CULQI_BASE_URL:https://api.culqi.com/v2}
app.payments.culqi.public-key=${CULQI_PUBLIC_KEY:}
app.payments.culqi.secret-key=${CULQI_SECRET_KEY:}

# Boletos: firma Ed25519 del QR (ADR 0009). La clave por defecto es SOLO de desarrollo y es pública en el repositorio:
# en producción se debe definir TICKET_SIGNING_KEY (PKCS8 en base64), TICKET_KEY_ID y TICKET_PUBLIC_KEYS.
app.tickets.key-id=${TICKET_KEY_ID:dev1}
app.tickets.signing-key=${TICKET_SIGNING_KEY:MC4CAQAwBQYDK2VwBCIEIAvV82Y+/crlbqjOYBU+iw35Vzsn1YivyKUzwuEPlwQM}
app.tickets.public-keys=${TICKET_PUBLIC_KEYS:dev1:MCowBQYDK2VwAyEAeZkwyN+q9bVj4/HNtG2rXw0NkpC/K7qasXUXZRFUBZw=}
app.tickets.repair-interval-ms=${TICKET_REPAIR_INTERVAL_MS:60000}
